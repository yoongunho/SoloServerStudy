<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>프론트엔드 테스트</title>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; margin-top: 100px; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    #result { margin-top: 20px; font-size: 18px; color: #333; }
  </style>
</head>
<body>
  <h1>백엔드 연결 테스트</h1>
  <button onclick="fetchMessage()">메시지 가져오기</button>
  <p id="result"></p>

  <script>
    async function fetchMessage() {
      try {
        const res = await fetch('http://localhost:3000/api/hello');
        const data = await res.json();
        document.getElementById('result').textContent = data.message;
      } catch (e) {
        document.getElementById('result').textContent = '서버에 연결할 수 없습니다.';
      }
    }
  </script>
</body>
</html>
