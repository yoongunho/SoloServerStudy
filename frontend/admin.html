<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIECLE TRAIN — 관리자</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a0a;
    color: #e0e0e0;
    font-family: 'Courier New', monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .panel {
    width: 100%;
    max-width: 560px;
    border: 1px solid #2a2a2a;
    padding: 40px;
    background: #111;
  }
  .panel-title {
    font-size: 11px;
    letter-spacing: 0.2em;
    color: #666;
    margin-bottom: 6px;
  }
  .panel-name {
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 0.05em;
    color: #fff;
    margin-bottom: 32px;
  }
  label {
    display: block;
    font-size: 11px;
    letter-spacing: 0.15em;
    color: #888;
    margin-bottom: 8px;
  }
  input[type="password"],
  input[type="url"],
  input[type="text"] {
    width: 100%;
    background: #0a0a0a;
    border: 1px solid #2a2a2a;
    color: #e0e0e0;
    font-family: 'Courier New', monospace;
    font-size: 13px;
    padding: 12px 14px;
    margin-bottom: 20px;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus { border-color: #555; }
  .btn {
    width: 100%;
    padding: 13px;
    background: #e0e0e0;
    color: #0a0a0a;
    border: none;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 0.15em;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn:hover { background: #fff; }
  .btn:disabled { background: #333; color: #666; cursor: not-allowed; }
  .msg {
    margin-top: 16px;
    font-size: 12px;
    letter-spacing: 0.05em;
    min-height: 18px;
  }
  .msg.ok  { color: #6fcf97; }
  .msg.err { color: #eb5757; }
  .divider {
    border: none;
    border-top: 1px solid #1e1e1e;
    margin: 28px 0;
  }
  .current-label {
    font-size: 11px;
    letter-spacing: 0.15em;
    color: #555;
    margin-bottom: 10px;
  }
  .current-url {
    font-size: 12px;
    color: #888;
    word-break: break-all;
    background: #0a0a0a;
    border: 1px solid #1e1e1e;
    padding: 10px 12px;
    min-height: 38px;
  }
  .preview {
    margin-top: 16px;
    aspect-ratio: 16/9;
    background: #000;
    display: none;
  }
  .preview iframe {
    width: 100%;
    height: 100%;
    border: none;
  }
</style>
</head>
<body>
<div class="panel">
  <div class="panel-title">SIECLE TRAIN · ADMIN</div>
  <div class="panel-name">트레일러 영상 관리</div>

  <label>관리자 비밀번호</label>
  <input type="password" id="pw" placeholder="비밀번호 입력">

  <label>트레일러 임베드 URL</label>
  <input type="text" id="url" placeholder="https://www.youtube.com/embed/VIDEO_ID">

  <button class="btn" onclick="save()">저장 →</button>
  <div class="msg" id="msg"></div>

  <hr class="divider">

  <div class="current-label">현재 설정된 URL</div>
  <div class="current-url" id="current-url">불러오는 중...</div>
  <div class="preview" id="preview">
    <iframe id="preview-frame" allowfullscreen></iframe>
  </div>
</div>

<script>
  async function load() {
    try {
      const res = await fetch('/api/trailer');
      const data = await res.json();
      const url = data.url || '';
      document.getElementById('current-url').textContent = url || '(없음)';
      if (url) {
        document.getElementById('preview').style.display = 'block';
        document.getElementById('preview-frame').src = url;
      }
    } catch {
      document.getElementById('current-url').textContent = '불러오기 실패';
    }
  }

  async function save() {
    const pw  = document.getElementById('pw').value.trim();
    const url = document.getElementById('url').value.trim();
    const msg = document.getElementById('msg');

    if (!pw) { msg.className = 'msg err'; msg.textContent = '비밀번호를 입력하세요.'; return; }

    const btn = document.querySelector('.btn');
    btn.disabled = true;

    try {
      const res  = await fetch('/api/admin/trailer', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pw, url }),
      });
      const data = await res.json();
      if (data.ok) {
        msg.className = 'msg ok';
        msg.textContent = '저장 완료.';
        load();
      } else {
        msg.className = 'msg err';
        msg.textContent = data.message || '오류가 발생했습니다.';
      }
    } catch {
      msg.className = 'msg err';
      msg.textContent = '서버 오류가 발생했습니다.';
    } finally {
      btn.disabled = false;
    }
  }

  load();
</script>
</body>
</html>
